services:
  app:
    build: .
    container_name: my_app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev
      - ci
      - e2e

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: my_frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://app:3000
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5173/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - dev
      - e2e

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    container_name: my_playwright
    working_dir: /app
    env_file:
      - .env.e2e
    environment:
      BASE_URL: http://frontend:5173
      API_URL: http://app:3000
      SECRET_WORD: test_secret_word
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run test:e2e"
    profiles:
      - e2e

  db:
    image: postgres:16
    container_name: my_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - ci
      - e2e

  test:
    build: .
    container_name: my_test
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    entrypoint: [ "/entrypoint-test.sh" ]
    command: npm run test
    profiles:
      - ci

volumes:
  db_data: