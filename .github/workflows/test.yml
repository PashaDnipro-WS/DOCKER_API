name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment files
        run: |
          cp .env.ci .env
          cp .env.test.ci .env.test
          cp .env.e2e.ci .env.e2e
          cp frontend/.env.ci frontend/.env

      - name: Run API tests with Docker Compose
        run: |
          docker compose --profile ci up --abort-on-container-exit --exit-code-from test

      - name: Cleanup API test containers
        if: always()
        run: |
          docker compose --profile ci down -v || true

      - name: Run Playwright UI tests with Docker Compose
        run: |
          rm -rf frontend/allure-results
          docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from playwright playwright

      - name: Cleanup UI test containers
        if: always()
        run: |
          docker compose --profile e2e down -v || true

      - name: Debug Allure results
        if: always()
        run: |
          echo "Allure results:"
          find frontend/allure-results -maxdepth 2 -type f | head -30 || true

      - name: Remove node_modules created by Docker
        if: always()
        run: |
          sudo rm -rf node_modules
          sudo rm -rf frontend/node_modules

      - name: Set up Java for Allure
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/allure

          if [ -d "frontend/allure-results" ] && [ "$(ls -A frontend/allure-results)" ]; then
            npx --yes allure-commandline generate frontend/allure-results --clean -o public/allure
          else
            echo "No Allure results found"
            echo "<h1>No Allure results found</h1>" > public/allure/index.html
          fi

      - name: Set up Node.js for Swagger build
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies for Swagger build
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm ci

      - name: Build Swagger documentation
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:swagger

      - name: Prepare GitHub Pages content
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/docs

          if [ -d "docs" ]; then
            cp -r docs/* public/docs/
          else
            echo "No Swagger docs found"
            echo "<h1>No Swagger docs found</h1>" > public/docs/index.html
          fi

      - name: Deploy reports to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: 'Deploy test reports and documentation'